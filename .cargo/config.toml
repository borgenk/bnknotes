# The standard library compiles from source with the editor, so LTO reaches across it
# and the release profile's immediate-abort panics take std's backtrace symbolizer out
# along with ours. optimize_for_size picks std's smaller algorithms, worth about 300 KB
# of the shipped file.
[unstable]
build-std = ["std", "panic_abort"]
build-std-features = ["optimize_for_size"]

# build-std needs a target named explicitly. This is the only one that ships, so it
# is the one named here; a build on another architecture has to pass its own
# --target. Naming it also puts every artifact under target/<triple>/.
[build]
target = "x86_64-unknown-linux-gnu"
