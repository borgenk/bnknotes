# panic = "immediate-abort" on the release profile is still unstable, which is
# what pins this project to nightly.
cargo-features = ["panic-immediate-abort"]

[package]
name = "bnknotes"
version = "0.1.0"
edition = "2024"
license = "MIT"

[[bin]]
name = "bnknotes"
path = "src/bin/bnknotes.rs"

# Image decoding is the only dependency: decoders parse untrusted bytes, so they
# are pure Rust, and src/render/image.rs is the one module that uses them.
[dependencies]
zune-core = { version = "0.5", default-features = false, features = ["std"] }
zune-png = { version = "0.5", default-features = false, features = ["std"] }
zune-jpeg = { version = "0.5", default-features = false, features = ["std"] }

[features]
# The counting global allocator in src/dev/alloc.rs, for the perf harness. A global
# allocator taxes every allocation, so only the measuring build carries one.
perf-alloc = []

# immediate-abort leaves out the unwinding tables, the panic formatter and std's
# backtrace symbolizer, so a release panic prints nothing and nothing may rely on
# unwinding (catch_unwind, a panic hook). Debug builds and the test harness keep
# unwinding panics.
#
# For symbols: --config profile.release.strip=false --config profile.release.debug=1
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "immediate-abort"
strip = true
