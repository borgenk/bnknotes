[package]
name = "bnknotes"
version = "0.1.0"
edition = "2021"

# Almost zero dependencies. The editor is a native Wayland client (the wire
# protocol is spoken directly over a UnixStream) and glyph rasterization FFIs
# into the system FreeType.
#
# The lone exception is image decoding (src/image.rs). Decoders parse hostile,
# attacker-controlled bytes, exactly the place where an in-tree decoder (or
# binding C libpng/libjpeg) would trade away the memory safety we want, so we
# lean on the pure-Rust, no-C zune decoders behind a single isolated module.
# default-features is off to compile only the decode path.
[dependencies]
zune-core = { version = "0.5", default-features = false, features = ["std"] }
zune-png = { version = "0.5", default-features = false, features = ["std"] }
zune-jpeg = { version = "0.5", default-features = false, features = ["std"] }

[features]
# Install the counting global allocator (src/alloc.rs) so the perf harness can
# report allocations per operation. Off by default: a global allocator taxes
# every allocation, so the shipping editor never carries it. `make perf` and
# `make perf-lab` enable it.
perf-alloc = []

[profile.release]
opt-level = 3
lto = true             # Link-time optimization (better perf + smaller binary)
codegen-units = 1      # Single codegen unit for better optimization
panic = "abort"        # No unwinding, smaller binary
debug = 1              # Line tables for readable crash backtraces
strip = "debuginfo"    # Strip DWARF info, keep symbol names for backtraces
